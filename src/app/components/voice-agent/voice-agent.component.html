<!-- Fixed pill anchored bottom-left via :host in SCSS -->
<div
  class="voice-agent pointer-events-auto inline-flex items-center gap-[10px] rounded-full pl-3 [border:1px_solid_color-mix(in_srgb,var(--color-border)_86%,var(--color-accent)_14%)] [background:linear-gradient(145deg,color-mix(in_srgb,var(--color-surface2)_92%,#0d151f_8%),color-mix(in_srgb,var(--color-surface)_94%,#05080d_6%))] [box-shadow:0_8px_24px_rgba(0,0,0,0.38),0_0_0_1px_rgba(30,184,224,0.08)]"
  role="complementary"
  aria-label="Voice Agent">
  <!-- Label row -->
  <div
    class="inline-flex items-center gap-[7px] text-[10px] tracking-[1.2px] font-bold whitespace-nowrap [color:var(--color-text-dim)]">
    <span
      class="voice-agent__dot w-[7px] h-[7px] rounded-full shrink-0 [background:var(--color-accent)] [box-shadow:0_0_10px_color-mix(in_srgb,var(--color-accent)_65%,transparent_35%)]">
    </span>
    <span class="whitespace-nowrap">Voice Agent</span>
  </div>

  <!-- Action buttons -->
  <div class="flex items-center gap-[6px]">
    <!-- Mic button — Under Construction -->
    <div
      class="relative"
      [tooltip]="'Under Construction'"
      tooltipPosition="top">
      <button
        type="button"
        class="voice-agent__button inline-flex items-center justify-center rounded-full w-[30px] h-[30px] shrink-0 cursor-not-allowed [border:1px_solid_var(--color-border)] [background:color-mix(in_srgb,var(--color-surface)_88%,#0f1722_12%)] [color:var(--color-text-dim)] opacity-50"
        [class.voice-agent__button--active]="isListening"
        [class.voice-agent__button--mic]="true"
        disabled
        aria-label="Microphone — under construction">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="w-[14px] h-[14px]"
          aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 18.75a6.75 6.75 0 006.75-6.75v-.75m-13.5 0V12A6.75 6.75 0 0012 18.75m0 0v3.75m-4.5 0h9" />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" />
        </svg>
      </button>
    </div>

    <!-- Play / Pause button -->
    <div class="relative">
      <button
        type="button"
        class="voice-agent__button inline-flex items-center justify-center rounded-full w-[30px] h-[30px] shrink-0 cursor-pointer [border:1px_solid_var(--color-border)] [background:color-mix(in_srgb,var(--color-surface)_88%,#0f1722_12%)] [color:var(--color-text-bright)] transition-[border-color,background-color,box-shadow] duration-200 ease-in-out disabled:opacity-45 disabled:cursor-not-allowed"
        [disabled]="!isSpeechSupported || activeLineNumber === null"
        [class.voice-agent__button--active]="isSpeaking && !isPaused"
        [tooltip]="
          !isSpeechSupported
            ? 'Not supported in this browser'
            : activeLineNumber === null
              ? 'Select a line to enable playback'
              : ''
        "
        tooltipPosition="top"
        [tooltipDisabled]="isSpeechSupported && activeLineNumber !== null"
        (click)="togglePlayback()"
        aria-label="Toggle playback">
        @if (isSpeaking && !isPaused) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="w-[14px] h-[14px]"
            aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 6.75v10.5m3-10.5v10.5" />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="w-[14px] h-[14px]"
            aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5.25 5.653c0-1.427 1.529-2.33 2.779-1.643l9.53 5.236c1.295.712 1.295 2.574 0 3.286l-9.53 5.236c-1.25.687-2.779-.216-2.779-1.643V5.653z" />
          </svg>
        }
      </button>
    </div>
  </div>
</div>
