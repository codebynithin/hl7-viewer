<footer
  class="w-full py-2 sm:py-3 px-4 bg-custom-surface border-t border-custom-border flex-shrink-0">
  <div
    class="flex flex-col sm:flex-row items-center sm:justify-between gap-1 sm:gap-0">
    <p class="text-[10px] sm:text-[11px] text-custom-text-dim font-medium">
      &copy; {{ currentYear }} HL7 Viewer maintained by
      <a
        href="https://codebynithin.com"
        target="_blank"
        class="text-custom-accent hover:underline"
        >Nithin V</a
      >. All rights reserved.
    </p>
    <a
      target="_blank"
      rel="noopener noreferrer"
      class="flex items-center gap-1 text-[10px] sm:text-[11px] text-custom-text-dim hover:text-custom-accent transition-colors duration-150 font-medium group"
      [href]="githubIssueUrl || null"
      [attr.aria-disabled]="!githubIssueUrl"
      [ngClass]="{ 'pointer-events-none opacity-50': !githubIssueUrl }">
      <svg
        class="w-3.5 h-3.5 text-custom-text-dim group-hover:text-custom-accent transition-colors"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 4v16m8-8H4" />
      </svg>
      Create a GitHub issue
    </a>
  </div>
</footer>
